<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17191c"><meta name="description" content="Name every track. Beat your personal best."><title>Album Recall</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#library">album recall<span>.</span></a><button id="share-site" class="quiet">Share game ↗</button></header><main><section id="library"><div class="eyebrow">THE MUSIC MEMORY GAME</div><h1>Library</h1><div class="intro"><p>Know the album by heart? Name every track.</p><button id="add" class="primary">+ Add album</button></div><input id="filter" type="search" placeholder="Search your library" aria-label="Search your library"><div id="tiles" class="tiles"></div></section><section id="game" hidden><button id="back" class="quiet">← Library</button><div class="game-layout"><div class="play"><form id="guess-form"><input id="guess" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter a song title…" aria-label="Song title"><button class="primary">Guess</button></form><p id="feedback" role="status">Start typing to begin.</p><ol id="tracks"></ol></div><aside><div id="game-art" class="art"></div><h2 id="album-title"></h2><p id="artist" class="muted"></p><div class="stats"><strong id="score"></strong><span id="timer">00:00</span></div><progress id="progress" max="100" value="0"></progress><div class="actions"><button id="restart">Restart</button><button id="reveal">Give up / reveal</button></div><section class="best"><div class="eyebrow">PERSONAL BEST</div><strong id="best-time">—</strong><p id="best-date" class="muted"></p><button id="history">Record history</button><button id="share-album" class="quiet">Share this album ↗</button></section></aside></div></section></main><footer>Made for music lovers. Records stay on this device.</footer><dialog id="search-dialog"><form method="dialog" class="dialog-head"><h2>Add an album</h2><button aria-label="Close">×</button></form><form id="search-form"><input id="search-term" placeholder="Artist or album" aria-label="Artist or album" required><button class="primary">Search</button></form><p id="search-status" role="status"></p><div id="results"></div></dialog><dialog id="history-dialog"><form method="dialog" class="dialog-head"><h2>Record history</h2><button aria-label="Close">×</button></form><p class="muted">Only new personal bests are saved.</p><div id="history-list"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
